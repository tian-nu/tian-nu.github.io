# Nusky 的小站 — Nginx 站点配置模板
# 备案通过后使用：复制到 /etc/nginx/sites-available/nusky.cn 并启用
# 静态文件部署目录：/var/www/nusky.cn

server {
    listen 80;
    server_name nusky.cn www.nusky.cn;

    root /var/www/nusky.cn;
    index index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    location / {
        try_files $uri $uri/ /404.html;
    }

    # 静态资源长缓存
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ---------- 备案通过并签发证书后启用 HTTPS ----------
    # listen 443 ssl http2;
    # ssl_certificate     /etc/letsencrypt/live/nusky.cn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/nusky.cn/privkey.pem;
    # if ($scheme = http) { return 301 https://$host$request_uri; }
}